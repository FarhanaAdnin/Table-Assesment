<!DOCTYPE html>
<html>
<head>
    <title>Table Assessment</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
        }
        table {
            margin: 20px auto;
            border-collapse: collapse;
            width: 50%;
        }
        th, td {
            padding: 10px;
            border: 1px solid black;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

<h2>Table 1</h2>
<table id="table1"></table>

<h2>Table 2</h2>
<table id="table2"></table>

<script>
fetch('Table_Input.csv')
.then(response => response.text())
.then(data => {

    const rows = data.trim().split('\n');
    let tableHTML = "<tr><th>Index #</th><th>Value</th></tr>";

    let values = {};

    rows.forEach((row, index) => {
        const cols = row.split(',');

        // Skip header if exists
        if (cols[0] === "Index #" || cols[0] === "Index") return;

        const key = cols[0].trim();
        const value = parseFloat(cols[1]);

        values[key] = value;

        tableHTML += `<tr><td>${key}</td><td>${value}</td></tr>`;
    });

    document.getElementById("table1").innerHTML = tableHTML;

    // Calculations
    const alpha = values["A5"] + values["A20"];
    const beta = values["A15"] / values["A7"];
    const charlie = values["A13"] * values["A12"];

    document.getElementById("table2").innerHTML = `
        <tr><th>Category</th><th>Value</th></tr>
        <tr><td>Alpha</td><td>${alpha}</td></tr>
        <tr><td>Beta</td><td>${beta}</td></tr>
        <tr><td>Charlie</td><td>${charlie}</td></tr>
    `;
});
</script>

</body>
</html>
